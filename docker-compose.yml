services:
  node-watcher:
    build:
      context: .
    image: node-watcher:local
    container_name: node-watcher
    ports:
      - "3000:3000"
      # TLS listener for remote probes. To disable probes, delete this line (the listener is then
      # unreachable from outside the container). PROBE_HOST_PORT changes the published host port.
      - "${PROBE_HOST_PORT:-7443}:7443"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-24}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MIHOMO_HTTP_PORT: ${MIHOMO_HTTP_PORT:-23333}
      MIHOMO_SOCKS_PORT: ${MIHOMO_SOCKS_PORT:-23334}
      MIHOMO_CONTROLLER_PORT: ${MIHOMO_CONTROLLER_PORT:-23335}
      MIHOMO_SECRET: ${MIHOMO_SECRET:-node-watcher-secret}
      PROBE_PORT: 7443
      PROBE_PUBLIC_HOST: ${PROBE_PUBLIC_HOST:-}
      PROBE_PUBLIC_PORT: ${PROBE_PUBLIC_PORT:-${PROBE_HOST_PORT:-7443}}
      LOCAL_PROBE: ${LOCAL_PROBE:-true}
      LOCAL_PROBE_NAME: ${LOCAL_PROBE_NAME:-}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
