services:
  node-watcher:
    build:
      context: .
    image: node-watcher:local
    container_name: node-watcher
    ports:
      - "3000:3000"
      # Built-in HTTPS (the one-click installer sets all of this up with --domain, including a
      # Let's Encrypt certificate that renews itself). For a manual setup: publish 80 -> 3000 and
      # 443 -> 3443 instead of the line above, uncomment the HTTPS variables below and put the
      # certificate into data/tls/ (fullchain.pem + key.pem), e.g. issued by acme.sh / certbot in
      # webroot mode with ./data/acme as the webroot.
      # - "80:3000"
      # - "443:3443"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      # false: write logs only to logs/ (not to `docker logs`)
      LOG_CONSOLE: ${LOG_CONSOLE:-true}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-24}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # miaospeed backends: the local engine (set false for a master that only uses remote
      # backends), its display name, and optional GeoIP mmdb files for topology tests.
      MIAOSPEED_LOCAL: ${MIAOSPEED_LOCAL:-true}
      LOCAL_PROBE_NAME: ${LOCAL_PROBE_NAME:-}
      MIAOSPEED_MMDB: ${MIAOSPEED_MMDB:-}
      # Address reverse backends dial, e.g. wss://monitor.example.com. Set it when the dashboard is
      # served over HTTPS by your own reverse proxy (it must forward websocket upgrades on
      # /miaospeed/reverse/), or with the built-in HTTPS below.
      MIAOSPEED_PUBLIC_URL: ${MIAOSPEED_PUBLIC_URL:-}
      # Built-in HTTPS (see the ports above); also set AUTH_COOKIE_SECURE=true and
      # MIAOSPEED_PUBLIC_URL=wss://<domain> in .env. HTTPS starts once both certificate files exist
      # and they are reloaded when renewed. HTTPS_PUBLIC_PORT is only needed when the published
      # HTTPS port is not 443 (it is used in redirects).
      # HTTPS_PORT: 3443
      # TLS_CERT_FILE: /app/data/tls/fullchain.pem
      # TLS_KEY_FILE: /app/data/tls/key.pem
      # ACME_WEBROOT: /app/data/acme
      # HTTPS_REDIRECT: "true"
      # HTTPS_PUBLIC_PORT: 443
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
