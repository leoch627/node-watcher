version: '3.8'

services:
  node-watcher:
    build: .
    container_name: node-watcher
    ports:
      - "3000:3000"
    volumes:
      - ./config.json:/app/config.json
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - node-watcher-network

networks:
  node-watcher-network:
    driver: bridge
