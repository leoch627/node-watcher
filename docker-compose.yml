services:
  node-watcher:
    build:
      context: .
    image: node-watcher:local
    container_name: node-watcher
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
