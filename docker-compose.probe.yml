# Remote probe: checks the master's nodes from this host's network and reports back over TLS.
# Create the probe in the master dashboard (Settings → Probes), then put its join string in .env:
#   NODE_WATCHER_JOIN=nwp://...
# and run: docker compose -f docker-compose.probe.yml up -d
services:
  node-watcher-probe:
    image: ${NODE_WATCHER_IMAGE:-ghcr.io/leoch627/node-watcher:latest}
    container_name: node-watcher-probe
    environment:
      NODE_ENV: production
      NODE_WATCHER_MODE: agent
      NODE_WATCHER_JOIN: ${NODE_WATCHER_JOIN:?Set NODE_WATCHER_JOIN in .env (copy it from the master)}
      # Optional: parallel media-check slots (experimental)
      MEDIA_CONCURRENCY: ${MEDIA_CONCURRENCY:-1}
    volumes:
      - ./probe-data:/app/data
    # The probe opens no ports: it only connects out to the master.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
